<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 480" width="100%" height="auto" fill="none">
  <defs>
    <linearGradient id="goldArchStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eddba8"/>
      <stop offset="50%" stop-color="#caa359"/>
      <stop offset="100%" stop-color="#936f2a"/>
    </linearGradient>
    <filter id="archGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#143020" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Golden Wire Line Art Branches (Left side and trailing) -->
  <g stroke="url(#goldArchStem)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Arch guideline left -->
    <path d="M50 430 C30 350, 25 240, 55 140 C80 60, 140 30, 190 30" stroke-width="1.2" opacity="0.85"/>
    <path d="M40 330 C20 280, 25 200, 45 150 C65 100, 110 50, 160 38" stroke-width="0.8" opacity="0.75"/>
    
    <!-- Delicate gold leaf loops left -->
    <path d="M48 240 C32 230, 28 238, 38 246 C44 250, 48 245, 48 240 Z" fill="#caa359" fill-opacity="0.3" stroke-width="1"/>
    <path d="M55 180 C40 170, 36 178, 46 186 C52 190, 56 185, 55 180 Z" fill="#caa359" fill-opacity="0.3" stroke-width="1"/>
    <path d="M75 110 C62 98, 58 106, 68 114 C74 118, 78 114, 75 110 Z" fill="#caa359" fill-opacity="0.3" stroke-width="1"/>
    <circle cx="50" cy="430" r="2.2" fill="#caa359"/>
    <circle cx="35" cy="205" r="1.8" fill="#caa359"/>
    <circle cx="95" cy="70" r="1.8" fill="#caa359"/>

    <!-- Gold sprigs hugging bottom-right -->
    <path d="M120 445 C180 465, 260 455, 320 410 C355 385, 365 330, 360 280" stroke-width="1.1" opacity="0.85"/>
    <path d="M220 460 C270 455, 320 430, 350 380" stroke-width="0.85" opacity="0.75"/>
    <circle cx="360" cy="280" r="2.2" fill="#caa359"/>
    <circle cx="352" cy="375" r="1.8" fill="#caa359"/>
  </g>

  <!-- Lush Watercolor Eucalyptus and Olive Leaves (Hugging bottom & right curve) -->
  <g filter="url(#archGlow)">
    <!-- Bottom curve leaves -->
    <path d="M70 435 C88 455, 112 450, 105 430 C98 420, 80 422, 70 435 Z" fill="#75937d" opacity="0.85"/>
    <path d="M110 440 C135 465, 160 455, 148 432 C138 420, 120 425, 110 440 Z" fill="#5a7a63" opacity="0.9"/>
    <path d="M150 448 C178 472, 205 462, 192 438 C182 425, 162 430, 150 448 Z" fill="#44644c" opacity="0.95"/>
    <path d="M195 455 C225 475, 252 462, 238 438 C226 425, 208 432, 195 455 Z" fill="#52725a" opacity="0.92"/>
    <path d="M240 450 C272 468, 298 450, 282 425 C270 412, 250 422, 240 450 Z" fill="#608068" opacity="0.9"/>

    <!-- Bottom-right corner & upward right flank leaves -->
    <path d="M280 435 C315 448, 338 428, 322 402 C308 390, 290 405, 280 435 Z" fill="#4d6d55" opacity="0.95"/>
    <path d="M315 410 C348 418, 365 395, 348 370 C332 358, 318 375, 315 410 Z" fill="#5a7a63" opacity="0.92"/>
    <path d="M335 375 C365 378, 378 352, 358 328 C344 318, 332 338, 335 375 Z" fill="#6d8c75" opacity="0.88"/>
    <path d="M345 330 C372 328, 382 305, 360 282 C348 272, 338 292, 345 330 Z" fill="#75937d" opacity="0.85"/>
    <path d="M348 285 C372 278, 378 255, 355 235 C345 228, 338 250, 348 285 Z" fill="#8ea693" opacity="0.8"/>
    <path d="M345 240 C365 230, 368 210, 348 195 C340 190, 334 210, 345 240 Z" fill="#9db4a2" opacity="0.75"/>

    <!-- Small White Blossoms around bottom-right -->
    <circle cx="210" cy="445" r="3.5" fill="#ffffff"/>
    <circle cx="210" cy="445" r="1.3" fill="#caa359"/>
    <circle cx="265" cy="435" r="3.2" fill="#ffffff"/>
    <circle cx="265" cy="435" r="1.2" fill="#caa359"/>
    <circle cx="318" cy="390" r="3.2" fill="#ffffff"/>
    <circle cx="318" cy="390" r="1.2" fill="#caa359"/>
    <circle cx="342" cy="350" r="2.8" fill="#ffffff"/>
    <circle cx="342" cy="350" r="1.0" fill="#caa359"/>
  </g>
</svg>