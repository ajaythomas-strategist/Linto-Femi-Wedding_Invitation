<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="100%" height="auto" fill="none">
  <defs>
    <!-- Radiant gold gradients -->
    <linearGradient id="goldStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eddba8"/>
      <stop offset="40%" stop-color="#caa359"/>
      <stop offset="100%" stop-color="#936f2a"/>
    </linearGradient>
    <linearGradient id="goldRay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0e2b6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#caa359" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eddba8" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#caa359" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#caa359" stop-opacity="0"/>
    </radialGradient>
    <!-- Filter for soft leaf shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#143020" flood-opacity="0.12"/>
    </filter>
  </defs>

